<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundle & Save - Interactive Boxes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2 class="title">Bundle & Save</h2>
        
        <div class="pricing-options">
            <!-- 1 Pair Option -->
            <div class="pricing-box" data-option="1">
                <div class="radio-container">
                    <input type="radio" name="pricing" id="option1" value="1">
                    <label for="option1"></label>
                </div>
                <div class="pricing-content">
                    <div class="pricing-header">
                        <span class="pair-count">1 Pair</span>
                        <span class="discount">50% OFF</span>
                    </div>
                    <div class="price">DKK 195.00</div>
                    <div class="expanded-content">
                        <div class="size-color-row">
                            <span class="label">Size</span>
                            <span class="label">Colour</span>
                        </div>
                        <div class="selection-row">
                            <select class="size-select">
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                            </select>
                            <select class="color-select">
                                <option value="colour">Colour</option>
                                <option value="black">Black</option>
                                <option value="white">White</option>
                                <option value="red">Red</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2 Pair Option -->
            <div class="pricing-box" data-option="2">
                <div class="radio-container">
                    <input type="radio" name="pricing" id="option2" value="2">
                    <label for="option2"></label>
                </div>
                <div class="pricing-content">
                    <div class="pricing-header">
                        <span class="pair-count">2 Pair</span>
                        <span class="popular-badge">Most Popular</span>
                        <span class="discount">40% OFF</span>
                    </div>
                    <div class="price">DKK 345.00</div>
                    <div class="expanded-content">
                        <div class="size-color-row">
                            <span class="label">Size</span>
                            <span class="label">Colour</span>
                        </div>
                        <div class="selection-row">
                            <select class="size-select">
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                            </select>
                            <select class="color-select">
                                <option value="colour">Colour</option>
                                <option value="black">Black</option>
                                <option value="white">White</option>
                                <option value="red">Red</option>
                            </select>
                        </div>
                        <div class="selection-row">
                            <select class="size-select">
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                            </select>
                            <select class="color-select">
                                <option value="colour">Colour</option>
                                <option value="black">Black</option>
                                <option value="white">White</option>
                                <option value="red">Red</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3 Pair Option -->
            <div class="pricing-box" data-option="3">
                <div class="radio-container">
                    <input type="radio" name="pricing" id="option3" value="3">
                    <label for="option3"></label>
                </div>
                <div class="pricing-content">
                    <div class="pricing-header">
                        <span class="pair-count">3 Pair</span>
                        <span class="discount">60% OFF</span>
                    </div>
                    <div class="price">DKK 528.00</div>
                    <div class="expanded-content">
                        <div class="size-color-row">
                            <span class="label">Size</span>
                            <span class="label">Colour</span>
                        </div>
                        <div class="selection-row">
                            <select class="size-select">
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                            </select>
                            <select class="color-select">
                                <option value="colour">Colour</option>
                                <option value="black">Black</option>
                                <option value="white">White</option>
                                <option value="red">Red</option>
                            </select>
                        </div>
                        <div class="selection-row">
                            <select class="size-select">
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                            </select>
                            <select class="color-select">
                                <option value="colour">Colour</option>
                                <option value="black">Black</option>
                                <option value="white">White</option>
                                <option value="red">Red</option>
                            </select>
                        </div>
                        <div class="selection-row">
                            <select class="size-select">
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                            </select>
                            <select class="color-select">
                                <option value="colour">Colour</option>
                                <option value="black">Black</option>
                                <option value="white">White</option>
                                <option value="red">Red</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="shipping-info">
            <span class="shipping-text">Free 2 Day Shipping</span>
            <span class="total">Total: DKK 360.00</span>
        </div>

        <button class="add-to-cart">+ Add to Cart</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
